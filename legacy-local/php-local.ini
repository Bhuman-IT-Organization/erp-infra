; Local development settings for the legacy ERP.
; max_input_vars is raised because the live .user.ini notes
; "PHP settings for large forms (100+ line items in PR/PO/GRN)".
max_input_vars = 5000
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

; Show errors locally. CodeIgniter 3 on PHP 8.2 emits deprecation notices;
; they are noise, not failures, so they are excluded from display.
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
date.timezone = UTC

; The base image leaves this empty, which breaks any file-based session.
; CodeIgniter uses the database driver here, but set it so nothing else trips.
session.save_path = "/tmp"
