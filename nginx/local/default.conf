  # ==== Security quick task 261001-m42 (Phase 4.4 D-08, D-52) ==========================================
  # Two live Perfex gaps found while studying the timesheets module. Both are
  # Nginx answers, not migrations: no Node screen replaces these paths yet. The CI3 alias block at the top of
  # this server has already unwrapped every index.php form, and `~*` takes every letter case (quick 260929-hdy).
  # Neither regex matches a path of the W1-06 or W2A-01 regexes above, and no `=` or `^~` shares their prefix.
  #
  # 1. timesheets::setting_zkbio_time (modules/timesheets/controllers/Timesheets.php:7239) writes the posted
  #    `value` into ANY tbloptions row named by the posted `name` (Timesheets_model.php:9597), with no permission
  #    check: any signed-in staff member can change any Perfex setting. Refused for EVERY method in all four MX
  #    URL forms; the ZKTeco settings tab cannot save (0 ZKTeco rows; accepted by the lead, D-08). The T4 cutover
  #    keeps this block. No managedAt: no Node page manages these settings yet.
  location ~* "^/(?:admin/)?timesheets/(?:timesheets/)?setting_zkbio_time(?:/|$)" {
    add_header X-Erp-Route web always;
    default_type application/json;
    return 403 '{"code":"ERP-LEGACY-0403","title":"This setting is closed in Perfex for security reasons."}';
  }
  # 2. core Sync_data (application/controllers/Sync_data.php, a CI_Controller with no login check):
  #    /sync_data/attendance starts a Hikvision sync of up to 365 days and writes punches and timesheets;
  #    /sync_data/status prints sync counts. Answered by Perfex only for a source in $erp_company_network (the geo
  #    block above); any other source gets the 403 below (D-52: restricted, not refused, until T4). Perfex has no
  #    /admin/sync_data route (it is a 404), so the path is anchored at /sync_data and /admin/proposals/sync_data,
  #    a real Proposals method, is never matched.
  location ~* "^/sync_data(?:/|$)" {
    add_header X-Erp-Route $erp_company_route always;
    default_type application/json;
    if ($erp_company_network = 0) {
      return 403 '{"code":"ERP-LEGACY-0403","title":"This address answers only on the company network."}';
    }
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  # ==== end 261001-m42 ===============================================================================

  # ==== Security quick task 261005-fdl ===============================================================
  # warehouse::wh_delete_error_file_day_before (modules/warehouse/controllers/Warehouse.php:11575) is a public
  # method with no permission check. It takes a folder prefix from the URL, globs it relative to the web root
  # and unlinks every match whose name does not end in a number, so any signed-in staff member can delete
  # web-root files. Its five callers are PHP calls inside the controller (the item export and four report
  # methods, `$this->...`), never a URL, so their cleanup of the export and report folders keeps working;
  # only the URL is closed. Refused for EVERY method in all four MX URL forms. The CI3 alias block at the top
  # of this server has already unwrapped every index.php form, and `~*` takes every letter case (quick
  # 260929-hdy). No regex above matches this name, and the `(?:/|$)` terminator keeps a longer name on Perfex.
  # The body is inline, as 261001-m42's: no Node page manages this, so there is no managedAt, and the two
  # shared refusal snippets each carry a fixed managedAt or identity text.
  location ~* "^/(?:admin/)?warehouse/(?:warehouse/)?wh_delete_error_file_day_before(?:/|$)" {
    add_header X-Erp-Route web always;
    default_type application/json;
    return 403 '{"code":"ERP-LEGACY-0403","title":"This address is closed in Perfex for security reasons."}';
  }
  # ==== end 261005-fdl ===============================================================================

  # ==== Security closure: four unauthenticated customer routes and one ungated staff write (plan 04.7-01) ==========
  # Warehouse_client (modules/warehouse/controllers/Warehouse_client.php:7) extends ClientsController with no sign-in
  # check: shipment_detail (:35) and stock_export_pdf (:154) and client_packing_list_pdf (:239) answer any visitor by a
  # bare id, and client_update_shipment_status (:189) writes ANY shipment's customer-visible status from the URL and a
  # timeline line, unauthenticated (warehouse brief §3, 4.7 D-24). The staff method update_shipment_status
  # (controllers/Warehouse.php:8616) writes any shipment's status with no permission check before it loads a module this
  # install lacks (4.7 research F6, lead decision 2026-10-05). All five answer 404 for every method, in both MX prefixes
  # and with the doubled module segment; the CI3 alias block above has unwrapped every index.php form and `~*` takes
  # every letter case. No managedAt: no Node page replaces them.
  # Kept on Perfex, unmatched: .../warehouse_client/shipment_detail_hash/<hash> (the e-mailed link) and
  # .../warehouse_client/shipments (the signed-in customer's list, D-25), the staff shipment_detail and stock_export_pdf.
  # Matching: `shipment_detail(?:/|$)` never matches shipment_detail_hash; no other Warehouse_client method starts with
  # the four names; `update_shipment_status(?:/|$)` matches no other Warehouse method and never the client's
  # client_update_shipment_status (other prefix); no earlier regex matches these paths and no `=` or `^~` location
  # shares their prefix.
  location ~* "^/(?:admin/)?warehouse/(?:warehouse/)?warehouse_client/(?:shipment_detail|client_update_shipment_status|stock_export_pdf|client_packing_list_pdf)(?:/|$)" {
    add_header X-Erp-Route web always;
    access_log off;
    return 404;
  }
  location ~* "^/(?:admin/)?warehouse/(?:warehouse/)?update_shipment_status(?:/|$)" {
    add_header X-Erp-Route web always;
    return 404;
  }
  # ==== end security closure 04.7-01 ==============================================================================

  # ==== Security closure: the ungated stock adjustment route (plan 04.8-01) =======================================
  # Warehouse::adjust (modules/warehouse/controllers/Warehouse.php:3903-3909) runs change_adjust on any loss adjustment
  # by id: it sets every line's batch to the counted number and writes the ledger rows, with no permission, approval or
  # state check, and answers JSON. No view or script calls it; approval is the only screen path that posts a draft
  # (4.8 D-19, warehouse brief §9.1). It answers 404 for every method, in both MX prefixes and with the doubled module
  # segment; the CI3 alias block above has unwrapped every index.php form and `~*` takes every letter case. No
  # managedAt: no Node page replaces it.
  # Kept on Perfex, unmatched: adjustment_fill_multiple_serial_number_modal (the serial modal, Warehouse.php:9415),
  # loss_adjustment, add_loss_adjustment, view_lost_adjustment and accounting's own adjustment route (another prefix).
  # Matching: `adjust(?:/|$)` matches only the method `adjust`, never `adjustment_*` or `adjustx`; no earlier regex
  # matches these paths and no `=` or `^~` location shares their prefix.
  location ~* "^/(?:admin/)?warehouse/(?:warehouse/)?adjust(?:/|$)" {
    add_header X-Erp-Route web always;
    return 404;
  }
  # ==== end security closure 04.8-01 ==============================================================================

  # ==== The staff and roles addresses (plan 04.2-29) =================================================
  # What moved (the lead's rule of 2026-10-04 and STATE Q9; UAT gap 5): Setup > Staff and Setup > Roles left /staff
  # and /roles for /setup/staff and /setup/roles. The api (/api/v1/...) and the permission codes keep their names.
  # The old Node addresses answer a PERMANENT redirect here (Q9), explicitly per screen path. Perfex's own addresses
  # keep the 302 every cutover uses (section W1-06 above).
  # Every redirect is relative (absolute_redirect off: no host from the request) and keeps the query as sent. The
  # rest of an old path is reflected only when it is `[A-Za-z0-9_-]` segments, matched by
  # ((?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]*): each character has one way to match (no nested optional repeat), so a
  # long path cannot backtrack (ReDoS-safe); anything else (an encoded CR LF, a space, a colon) answers 404, never
  # a Location (T-4.2-143, T-4.2-147).
  #
  # Matching, read over the finished file (legacy-routes.json): no Perfex path equals /staff, /roles, /setup/staff
  # or /setup/roles, or starts with /staff/, /roles/, /setup/staff/ or /setup/roles/. `=` and `^~` beat every regex,
  # so no earlier regex can take a path below.

  # 1. The old Node addresses -> the new ones, 301, relative, the query kept.
  location = /staff {
    absolute_redirect off;
    add_header X-Erp-Route web always;
    return 301 /setup/staff$is_args$args;
  }
  location ^~ /staff/ {
    absolute_redirect off;
    add_header X-Erp-Route web always;
    rewrite "^/staff/((?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]*)$" /setup/staff/$1 permanent;
    return 404;
  }
  location = /roles {
    absolute_redirect off;
    add_header X-Erp-Route web always;
    return 301 /setup/roles$is_args$args;
  }
  location ^~ /roles/ {
    absolute_redirect off;
    add_header X-Erp-Route web always;
    rewrite "^/roles/((?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]*)$" /setup/roles/$1 permanent;
    return 404;
  }

  # 2. The Node pages (IN-03; erp-web's proxy.ts sends an anonymous visitor to /login?next=...).
  location = /setup/staff {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location ^~ /setup/staff/ {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location = /setup/roles {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location ^~ /setup/roles/ {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  # ==== end staff and roles addresses ================================================================

  # ==== W2C: the Email screens (plan 04.3-11, ADR-0049) =============================================
  # Node's own email templates, sent-email log and status page. Perfex's /admin/emails and its SMTP
  # settings stay Perfex's (D-03): nothing here refuses or redirects a Perfex path. The api is under ^~ /api/v1/.
  # erp-web's proxy.ts sends an anonymous visitor to /login?next=... before the page renders.
  #
  # Matching, read over the finished file: these are `=` and `^~` locations under /setup/, a prefix no Perfex
  # path uses, and no regex above matches a /setup/ path; `^~ /setup/email-templates/` does not take
  # /setup/email-templates-x, and none of the five shares a prefix with /setup/expense-categories, /setup/taxes or
  # /setup/cost-centers. /admin/emails and /admin/settings?group=email fall to `location /`.
  location = /setup/email-templates {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location ^~ /setup/email-templates/ {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location = /setup/sent-emails {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location ^~ /setup/sent-emails/ {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location = /setup/email-status {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  # ==== end W2C ======================================================================================

  # The legacy-side SSO module (erp-infra/legacy/modules/erp_sso): handoff of the Node JWT into a CI session.
  location ^~ /erp_sso/ {
    add_header X-Erp-Route legacy always;
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  # ADR-0030 decision 2: the attendance app's HS256 API stays on Perfex until Phase 1.4 migrates it to Node.
  # These three prefixes are outside /api/v1/ and never collide with Node routes. Do not route them to node_api.
  location ^~ /api/auth/       { add_header X-Erp-Route legacy always; proxy_pass http://legacy; include snippets/proxy-common.conf; }
  location ^~ /api/attendance/ { add_header X-Erp-Route legacy always; proxy_pass http://legacy; include snippets/proxy-common.conf; }
  location ^~ /api/face/       { add_header X-Erp-Route legacy always; proxy_pass http://legacy; include snippets/proxy-common.conf; }
  # ADR-0030 decision 3: the timesheets module's JWT issuer signs with a vendor default key; switched off here.
  # No consumer of timesheets/api/* exists in the client's data. Reversible by deleting this block.
  # One `~*` location since quick 261001-m42 (Phase 4.4 D-08, brief §10 Q1): the old `^~ /timesheets/api/` was
  # case-sensitive and missed the other URLs of the same controllers. MX_Router serves the API under the module
  # route (/timesheets/api/<m>, modules/timesheets/config/routes.php) AND by name as api_timesheets, its REST base
  # api_timesheets_controller and the vendor Login controller, each in the four MX forms (/admin/<m>/<m>/<c>,
  # /admin/<m>/<c>, /<m>/<m>/<c>, /<m>/<c>); none of the four names is a Timesheets method (api_document stops at
  # `(?:/|$)`), and the CI3 alias block unwraps the index.php forms. Same answer as before, byte for byte.
  location ~* "^/(?:admin/)?timesheets/(?:timesheets/)?(?:api|api_timesheets|api_timesheets_controller|login)(?:/|$)" {
    add_header X-Erp-Route legacy always;
    default_type application/json;
    return 410 '{"code":"ERP-LEGACY-0410","title":"This token issuer is switched off (ADR-0030)"}';
  }

  # Everything else stays with the legacy system (Perfex/CI3).
  location / {
    add_header X-Erp-Route legacy always;
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
}
