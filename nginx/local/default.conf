# Local strangler routing, hand-written in the shape of erp-docs 03-architecture/05-strangler-fig-migration.md.
# The routing.yml renderer that generates this per customer arrives in Phase 5.
#
# ADR-0031 §4: keepalive_timeout MUST stay below erp-api's TIMINGS.fastify.keepAliveTimeoutMs (65 s) so Nginx
# closes an idle upstream socket before Fastify does; the other order is the classic intermittent 502.
upstream node_api { server api:3000; keepalive 32; keepalive_timeout 60s; }
upstream node_web { server web:3000; }
upstream legacy   { server legacy:80; }

# ADR-0031 §6: Nginx compresses what nobody else does — legacy (Apache/PHP) and static responses. Api locations turn
# this off (snippets/proxy-api.conf); the web upstream already sends Content-Encoding, which Nginx never re-encodes.
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

# Brute-force control for the Node login (Nginx limit_req is the first line, the
# Redis lockout in erp-api the second). 60/min per IP with a burst of 20 so a test run can exercise the app lockout.
limit_req_zone $binary_remote_addr zone=auth_login:1m rate=60r/m;
limit_req_status 429;

# ADR-0030 decision 1: the Next.js page replaces the Perfex staff login. Only a plain GET of the exact login path is
# redirected; `?legacy=1` keeps the Perfex form reachable (two-factor accounts, support), and the form's own POST and
# /forgot_password stay legacy; /admin/authentication/logout is three-way like it (ADR-0038, its block below).
map $request_method$arg_legacy $erp_login_redirect {
  "GET"   1;
  default 0;
}

# W1-06 (plan 03.1-09): the staff and roles paths answer three ways and the METHOD is part of the
# decision, which a `location` cannot express — so the key is the same `$request_method$arg_legacy` the
# login map above uses. That map is reused as written for "a plain GET without ?legacy=1": it is generic
# despite its name. Three more variables complete the decision, each doing one thing:
#
#   plain GET             -> 302 to the Node screen        ($erp_login_redirect = 1)
#   ?legacy=1 (GET/HEAD)  -> Perfex answers, read-only     (ADR-0030's escape hatch)
#   any other method      -> refused 403                   ($erp_identity_write = 1, ADR-0034 d.1)
#
# A write is decided by the method alone, never by the query string: `?legacy=0` must not turn a POST
# into a read. HEAD is a read beside GET because Nginx answers it from the GET path.
map $request_method $erp_identity_write {
  "GET"   0;
  "HEAD"  0;
  default 1;
}
# X-Erp-Route for a path whose only Node behaviour is the redirect (the staff and roles LIST paths, which
# perform no write: Perfex's own DataTable posts to them to fetch rows, and that POST must reach Perfex).
map $erp_login_redirect $erp_read_route {
  1       web;
  default legacy;
}
# X-Erp-Route for a RECORD path (member/role): `web` when we redirect and when we refuse a write, and
# `legacy` only for the ?legacy=1 read that Perfex really answers. Chained on the two maps above so
# every method/flag combination is covered by construction rather than by a list of literals.
map $erp_identity_write $erp_record_route {
  1       web;
  default $erp_read_route;
}

# W2A-01 (plan 04.1-07): a Wave 2a Setup LIST path answers two ways, and the METHOD alone decides:
#
#   GET or HEAD           -> 302 to the Node list           ($erp_setup_list_redirect = 1)
#   any other method      -> Perfex answers                 (its own DataTable POST, a read)
#
# There is no `?legacy=1` escape here (D-16), so the query string never takes part: `$arg_legacy` is not in
# the key, unlike the W1-06 maps above. HEAD is a read beside GET because Nginx answers it from the GET path.
map $request_method $erp_setup_list_redirect {
  "GET"   1;
  "HEAD"  1;
  default 0;
}
# X-Erp-Route for a Setup LIST path: `web` when we redirect, `legacy` when Perfex answers the DataTable read.
map $erp_setup_list_redirect $erp_setup_list_route {
  1       web;
  default legacy;
}

# /sync_data/* (quick 261001-m42, Phase 4.4 D-52): core Sync_data has no login check, and nobody knows whether a
# scheduled job calls it, so it is restricted to the company network rather than refused (the T4 cutover refuses it).
# The ranges are rendered per deployment by scripts/render-local-env.mjs from ERP_COMPANY_NETWORKS (default: the
# private ranges and loopback) into snippets/company-network.conf, gitignored; run the renderer before restarting
# Nginx, or Nginx refuses to start (the include is not a glob on purpose: a missing allow-list must be loud).
# `proxy 127.0.0.1`: X-Forwarded-For is honoured ONLY from the loopback, so a caller anywhere else cannot claim an
# address, and the wire proof (verify-wave0 21f) can test the deny path from inside this container.
geo $erp_company_network {
  default 0;
  proxy   127.0.0.1;
  include snippets/company-network.conf;
}
# X-Erp-Route for /sync_data/*: Perfex answers an allowed source, Nginx refuses any other.
map $erp_company_network $erp_company_route {
  1       legacy;
  default web;
}

# Web dev mode's hot reload websocket (location /_next/hmr): pass the client's upgrade on, and
# close a plain request's connection as nginx would by default.
map $http_upgrade $erp_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Perfex uploads (expenses, invoice attachments, knowledge base) must behave the same through
  # :8088 as on :8080. Nginx's default is 1m, which would 413 anything larger before PHP sees it.
  # This value tracks the legacy PHP limits: erp-infra/legacy-local/php-local.ini
  # sets upload_max_filesize = 64M and post_max_size = 64M. Change both together (review WR-05).
  # Node routes keep their own body limits (Fastify bodyLimit); this only stops Nginx cutting first.
  client_max_body_size 64m;

  # ==== CI3 URL aliases (quick 260929-hdy) ============================================================
  # CodeIgniter 3.1.11 reads REQUEST_URI (system/core/URI.php:127-128) and routes ONE controller method
  # under more URLs than the path a location matches, so a location that closes /admin/roles/delete must
  # also see those URLs, or they reach Perfex with the caller's session:
  #   /index.php/<p>             SCRIPT_NAME is stripped                          (URI.php:213-222)
  #   /index.php?/<p>[?<a>]      the query form, read when nothing is left of the  (URI.php:226-231)
  #   /?/<p>, /index.php/?/<p>   path after that strip; <a> becomes the query string
  # `index.php` is matched in any letter case: locally the legacy tree is a bind mount of a
  # case-insensitive disk, where /Index.php/<p> reaches Perfex too.
  # This block unwraps ONE alias into $uri and $args before any location is chosen, so every location
  # below answers the alias exactly as it answers <p>, today and for every later wave. It is an internal
  # rewrite, never a redirect: a redirect would turn a refused POST into a GET that looks like success.
  # Two guards keep Nginx and CI3 reading the same path:
  #   NESTED     CI3 unwraps one level only: /index.php?/index.php/<p> is a 404 there and /index.php?/?/<p>
  #              is its default controller. Forwarding a half-unwrapped request would let Perfex unwrap
  #              the second level, so a result that is itself an alias is left untouched and Perfex
  #              answers the original request, as it did before this block.
  #   MALFORMED  CI3 DROPS empty and ".." segments (URI.php:303-316) where Nginx resolves ".." and never
  #              normalises a rewritten path, so /admin/roles/../delete/<id> is Roles::delete for CI3 but
  #              /admin/delete/<id> for Nginx. A raw ".." segment in the request path, or an empty, "."
  #              or ".." segment in an unwrapped query form, is answered 400 by the location below.
  #              Browsers resolve dot segments before sending, and Perfex's own links use neither
  #              index.php nor the query form (site_url has no index.php), so no real page sends either.
  # Only `set` and `rewrite` inside these `if`s: the rewrite-module-only use of `if`, which is safe.
  # Proven on the wire by scripts/verify-wave0.mjs 17m to 17t.
  set $erp_ci_uri   $uri;
  set $erp_ci_args  $args;
  set $erp_ci_alias "";
  if ($request_uri ~ "^[^?]*/\.\.(?:/|\?|$)") {
    rewrite ^ /.erp-ci-malformed last;
  }
  if ($uri ~* "^/index\.php(?<erp_ci_rest>/.*)$") {
    set $erp_ci_uri   $erp_ci_rest;
    set $erp_ci_alias 1;
  }
  set $erp_ci_front "";
  if ($erp_ci_uri ~* "^/(?:index\.php)?$") {
    set $erp_ci_front 1;
  }
  set $erp_ci_probe "$erp_ci_front|$args";
  if ($erp_ci_probe ~ "^1\|(?<erp_ci_qpath>/[^?]*)(?:\?(?<erp_ci_qargs>.*))?$") {
    set $erp_ci_uri   $erp_ci_qpath;
    set $erp_ci_args  $erp_ci_qargs;
    set $erp_ci_alias 1;
  }
  set $erp_ci_probe "$erp_ci_uri|$erp_ci_args";
  if ($erp_ci_probe ~* "^/(?:index\.php(?:/|\|)|\|/)") {
    set $erp_ci_alias "";
  }
  set $erp_ci_probe "$erp_ci_alias|$erp_ci_uri";
  if ($erp_ci_probe ~ "^1\|.*(?://|/\.\.?(?:/|$))") {
    rewrite ^ /.erp-ci-malformed last;
  }
  if ($erp_ci_alias) {
    set $args $erp_ci_args;
    rewrite ^ $erp_ci_uri last;
  }
  location = /.erp-ci-malformed {
    internal;
    add_header X-Erp-Route web always;
    return 400;
  }
  # ==== end CI3 URL aliases ===========================================================================

  # JWKS for the legacy SSO module and any verifier; public keys only. Exact match: everything else under
  # /.well-known/ stays with legacy (Pitfall 3 of the 1.3 research).
  location = /.well-known/jwks.json {
    add_header X-Erp-Route api always;
    proxy_pass http://node_api;
    include snippets/proxy-common.conf;
    include snippets/proxy-api.conf;
  }
  location = /api/v1/auth/login {
    limit_req zone=auth_login burst=20 nodelay;
    add_header X-Erp-Route api always;
    proxy_pass http://node_api;
    include snippets/proxy-common.conf;
    include snippets/proxy-api.conf;
  }

  # Migrated API modules: everything under the Node prefix.
  location ^~ /api/v1/ {
    add_header X-Erp-Route api always;
    proxy_pass http://node_api;
    include snippets/proxy-common.conf;
    include snippets/proxy-api.conf;
  }

  # Migrated UI paths (one page in Phase 1.2; /login and /logout since 1.3).
  location = /status {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location ^~ /status/ {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  # Migrated UI paths (wave 0): the Next.js login and logout pages.
  location = /login {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location ^~ /login/ {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location = /logout {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  location ^~ /logout/ {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  # Migrated UI paths (wave 1, W1-04): the Next.js staff and roles screens lived at /staff and /roles. Since plan
  # 04.2-29 they are /setup/staff and /setup/roles (STATE Q9); the staff and roles address section below routes the
  # new addresses to web and answers the old ones with a permanent redirect. The /admin/staff and /admin/roles redirects are W1-06's.
  # Hot reload for web dev mode (compose/local.web-dev.yml): `next dev` pushes every saved change to the
  # browser over a websocket on this path. proxy-common.conf clears `Connection` for upstream keepalive,
  # which would drop the upgrade, so this path sets its own headers instead of including it (a second
  # `proxy_set_header Connection` in the same block would send the header twice). The production build
  # serves no such endpoint and answers 404, so the block is harmless outside dev mode.
  location = /_next/hmr {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $erp_connection_upgrade;
    proxy_read_timeout 1h;
  }
  # Next.js assets and RSC payloads for migrated pages. Without this the page's CSS/JS fall through to legacy.
  location ^~ /_next/ {
    add_header X-Erp-Route web always;
    proxy_pass http://node_web;
    include snippets/proxy-common.conf;
  }
  # erp-web's own static files (public/): the self-hosted Inter font. Brand assets are NOT here — the
  # logo is customer data under legacy's /uploads/company/ (reached by the catch-all), named by /api/v1/branding.
  location ^~ /fonts/ { add_header X-Erp-Route web always; proxy_pass http://node_web; include snippets/proxy-common.conf; }

  # ADR-0030 decision 1: GET of the Perfex staff login goes to the Next.js page (see the map above).
  location = /admin/authentication {
    # absolute_redirect off: Nginx would otherwise build the Location from $host, which has no port, and the browser
    # would land on http://localhost/login instead of :8088 (the same port loss Phase 1.2 fixed with Host $http_host).
    # A relative Location is valid (RFC 7231 §7.1.2) and echoes no request header into the redirect.
    absolute_redirect off;
    if ($erp_login_redirect) { return 302 /login; }
    add_header X-Erp-Route legacy always;
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  # Perfex's staff logout (quick 260927-scq, ADR-0038): a plain GET goes to the Node sign-out page, which signs out
  # of both systems on arrival (from=legacy) and ends on the login form, as Perfex's link did alone before;
  # /login resumes a live Node session, so a Perfex-only logout would sign the member straight back in.
  # `?legacy=1` (that page's own last hop) and any other method reach Perfex, the three-way shape of
  # `location = /admin/authentication` above.
  location = /admin/authentication/logout {
    absolute_redirect off;
    if ($erp_login_redirect) { return 302 /logout?from=legacy; }
    add_header X-Erp-Route legacy always;
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  # ==== W1-06: Perfex's staff and roles screens are Node's now (plan 03.1-09) =======================
  # ADR-0033's exit plan ("Wave 1, immediately after the app shell") and ADR-0034 decision 1: Node owns
  # tblstaff, tblstaff_permissions and tblroles, so Perfex's own staff and roles screens are redirected to
  # the Node pages and their write paths are closed. `?legacy=1` still reads the Perfex page (ADR-0030),
  # and every path brief §9 keeps for the other modules has its own block below.
  #
  # Nginx matching order, read top to bottom over the finished file and confirmed on the wire: the CI3
  # alias block at the top of this server runs first (the server rewrite phase) and hands every location
  # the unwrapped path; then exact `=` wins, then the longest `^~` prefix, then the regex locations IN THE
  # ORDER THEY APPEAR HERE, then the longest plain prefix (`location /`, which is legacy). The staff and
  # roles screen blocks (since plan 04.2-29: /setup/staff, /setup/roles and the old /staff and /roles
  # redirects) are `=` and `^~`, a different prefix from the /admin/* blocks here, so they cannot collide. The three legacy-only paths below are `=`/`^~`, so they beat
  # every regex whatever the order. The two closed core paths of section 2 are the FIRST regex locations
  # in the file, so no other regex can take their paths.

  # 1. Still Perfex's (brief §9). Getting these wrong breaks the seven modules' permission modals and the
  #    member's own profile page. /admin/staff/delete takes its id in the POST BODY, not the path, so the
  #    exact match is the whole route; the other two take it in the path and need the prefix.
  location = /admin/staff/delete                      { add_header X-Erp-Route legacy always; proxy_pass http://legacy; include snippets/proxy-common.conf; }
  location ^~ /admin/staff/role_changed               { add_header X-Erp-Route legacy always; proxy_pass http://legacy; include snippets/proxy-common.conf; }
  location ^~ /admin/staff/remove_staff_profile_image { add_header X-Erp-Route legacy always; proxy_pass http://legacy; include snippets/proxy-common.conf; }

  # 2. Perfex's core write paths for the tables Node now owns. Both are reached by an AJAX GET or a link,
  #    not only by a POST, so they are closed for EVERY method — the method map cannot help here.
  #    `~*` and a bare prefix since quick 260929-hdy: PHP method names are case-insensitive (and on a
  #    case-insensitive disk so are the directory and controller segments), so `^~` (case-sensitive) let
  #    /admin/roles/DELETE/<id> reach Perfex. A bare prefix, so every path the `^~` closed stays closed.
  location ~* "^/admin/staff/change_staff_status" { add_header X-Erp-Route web always; default_type application/json; include snippets/refuse-identity-write.conf; }
  location ~* "^/admin/roles/delete"              { add_header X-Erp-Route web always; default_type application/json; include snippets/refuse-identity-write.conf; }

  # 3. The seven modules' permission-WRITE endpoints (ADR-0034's Context). Each one
  #    writes tblstaff.role, a member's whole tblstaff_permissions set, or a role — with no audit row and
  #    leaving Node's auth:perm:{staffId} snapshot stale — and four are reachable by a non-administrator
  #    (purchase and quality on a settings code, hr_profile through an operator-precedence bug, and
  #    timesheets::update_permissions with no gate at all). The modals still OPEN: permission_modal,
  #    *_permission_table, role_changed and hr_role_changed are reads and are deliberately not matched.
  #    MX_Router serves every module method under four URL forms (/admin/<m>/<m>/<x>, /admin/<m>/<x>,
  #    /<m>/<m>/<x>, /<m>/<x>), so one regex closes all four; `~*` because a CI3 URL segment's case is not
  #    ours to trust; its index.php forms are unwrapped by the CI3 alias block (quick 260929-hdy).
  #    hr_profile's own member screens also write tblstaff, and POST hr_profile/add_edit_member/<id> is a second
  #    permission grid (finding 6; 03.1-VERIFICATION gap 6): its views render permissions[...] inputs and
  #    Hr_profile_model::update_staff() rewrites the member's role and whole tblstaff_permissions set, gated on
  #    hrm_hr_records rather than on any staff permission. This regex does not match it (it is not a
  #    permission-write method name), so it still reaches Perfex. Also on Perfex and writing tblstaff: the shared
  #    dispatcher hrm_delete_bulk_action, whose hrm_staff case sets active = 0, the resignation approval
  #    (status_work) and core's Employee Documents (six HR columns), none of them a role or a permission. Read
  #    erp-docs 03-architecture/05-strangler-fig-migration.md (the tblroles/tblstaff_permissions row) before
  #    touching this block.
  location ~* "^/(?:admin/)?(?:fixed_equipment|hr_payroll|hr_profile|purchase|quality|timesheets|warehouse)/(?:(?:fixed_equipment|hr_payroll|hr_profile|purchase|quality|timesheets|warehouse)/)?(?:update_permissions|update_staff_permission|hr_payroll_update_permissions|hr_profile_update_permissions|purchase_update_permissions|quality_update_permissions|warehouse_update_permissions|delete_permission|delete_hr_payroll_permission|delete_hr_profile_permission|delete_purchase_permission|delete_quality_permission|delete_warehouse_permission)(?:/|$)" {
    add_header X-Erp-Route web always;
    default_type application/json;
    include snippets/refuse-identity-write.conf;
  }

  # 4. The redirects. absolute_redirect off in every one: Nginx would otherwise build the Location from
  #    $host, which has no port, and the browser would land on http://localhost/staff instead of :8088
  #    (the same port loss the login block above explains; a relative Location is RFC 7231 §7.1.2 valid
  #    and echoes no request header into the redirect).
  #    The LIST paths: one regex each instead of two exact blocks, so a bookmark of /admin/staff,
  #    /admin/staff/, /admin/staff/index and /admin/staff/index/ all land on the Node screen. Writes are
  #    NOT refused here — Staff::index() and Roles::index() perform none, and Perfex's own DataTable POSTs
  #    to these paths to fetch its rows, which must keep reaching Perfex under ?legacy=1.
  #    These two stay `~` (quick 260929-hdy): they refuse nothing, so a case variant reaching Perfex is a read.
  location ~ "^/admin/staff/?(?:index/?)?$" {
    absolute_redirect off;
    add_header X-Erp-Route $erp_read_route always;
    if ($erp_login_redirect) { return 302 /setup/staff; }
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  location ~ "^/admin/roles/?(?:index/?)?$" {
    absolute_redirect off;
    add_header X-Erp-Route $erp_read_route always;
    if ($erp_login_redirect) { return 302 /setup/roles; }
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  #    The RECORD paths: the id is in the URL, so these need a regex capture — new ground the login
  #    precedent does not exercise. The class is digits only (T-3.1-82: nothing but digits reaches the
  #    Location, so no host can be injected into it), the id-form block comes FIRST because regexes are
  #    tried in order, and the id-less form is Perfex's "add new". A plain GET redirects, a write is
  #    refused, and only the ?legacy=1 read reaches Perfex — which is what makes that page read-only.
  #    `~*` since quick 260929-hdy: a write in any letter case is refused like the lower-case one, a GET
  #    in any letter case redirects, and the capture is still digits only (T-3.1-82).
  location ~* "^/admin/staff/member/([0-9]+)(?:/|$)" {
    absolute_redirect off;
    add_header X-Erp-Route $erp_record_route always;
    default_type application/json;
    if ($erp_login_redirect) { return 302 /setup/staff/$1; }
    if ($erp_identity_write) { include snippets/refuse-identity-write.conf; }
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  location ~* "^/admin/staff/member(?:/|$)" {
    absolute_redirect off;
    add_header X-Erp-Route $erp_record_route always;
    default_type application/json;
    if ($erp_login_redirect) { return 302 /setup/staff/new; }
    if ($erp_identity_write) { include snippets/refuse-identity-write.conf; }
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  location ~* "^/admin/roles/role/([0-9]+)(?:/|$)" {
    absolute_redirect off;
    add_header X-Erp-Route $erp_record_route always;
    default_type application/json;
    if ($erp_login_redirect) { return 302 /setup/roles/$1; }
    if ($erp_identity_write) { include snippets/refuse-identity-write.conf; }
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  location ~* "^/admin/roles/role(?:/|$)" {
    absolute_redirect off;
    add_header X-Erp-Route $erp_record_route always;
    default_type application/json;
    if ($erp_login_redirect) { return 302 /setup/roles/new; }
    if ($erp_identity_write) { include snippets/refuse-identity-write.conf; }
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }
  # No new /api/v1/identity block: `location ^~ /api/v1/` above already covers it.
  # ==== end W1-06 ====================================================================================

  # ==== W2A-01: Expense Categories, the Wave 2a pilot (plan 04.1-07) ==================================
  # What moved: Perfex's Setup -> Finance -> Expenses Categories list is the Node list at
  # /setup/expense-categories, and its table, tblexpenses_categories, is written by erp-api's
  # v1/expense-categories module (/api/v1/expense-categories, covered by `^~ /api/v1/` above). The register
  # flip that makes Node the owner is plan 04.1-02; nothing below was added before that flip and the
  # module were live (T-3.1-84).
  # What stays on Perfex (D-14): two co-writers of the same table, kept until Expenses and Timesheets
  # migrate, on the precedent of `= /admin/staff/delete`: the expense form's inline "+" (POST
  # /admin/expenses/category) and the timesheets requisition's add (/admin/timesheets/add_expense_category).
  # Only Perfex's delete is refused, and it is refused for every method.
  # The CI3 alias block at the top of this server has already unwrapped every alias (/index.php/<p>,
  # /index.php?/<p>, /?/<p>, /index.php/?/<p>) before any location is chosen, so each location here is
  # written once, for the canonical path, with no per-location index.php prefix (quick 260929-hdy).
  # There is no `?legacy=1` escape on the list (D-16): every GET of it lands on the Node list.
  #
  # Matching, read over the finished file: `category` (the `=` block) never matches `categories`, and an
  # exact match beats every regex; `delete_category` is not a prefix of any list path, and the list regex
  # is anchored with `/?$`, so neither regex takes the other's path; no `^~` covers /admin/expenses; the
  # W1-06 regex locations come first in the file and match none of these paths (section 3's module list
  # has neither `expenses` nor `add_expense_category`). /admin/expenses, /admin/expenses/expense and
  # /admin/accounting/expense_category_mapping match nothing here and fall to `location /` (legacy).

  # 1. Still Perfex's (D-14). The inline add takes the id of an edit in the POST BODY, and create and update
  #    share the one URL, so Nginx cannot tell them apart and the exact match is the whole route. It would
  #    fall to `location /` anyway; this block documents the recorded co-writer, as W1-06 did for
  #    /admin/staff/delete. The timesheets add needs no block: all four of its MX URL forms fall to
  #    `location /`, and the module regex of W1-06 section 3 does not match add_expense_category.
  location = /admin/expenses/category { add_header X-Erp-Route legacy always; proxy_pass http://legacy; include snippets/proxy-common.conf; }

  # 2. Perfex's delete, closed for EVERY method (it is a link, a GET, not only a POST). `~*` and a bare
  #    prefix, as W1-06 section 2 since quick 260929-hdy: a PHP method name is case-insensitive, so
  #    /admin/expenses/DELETE_CATEGORY/<id> is the same Expenses::delete_category.
  location ~* "^/admin/expenses/delete_category" {
    set $erp_managed_at /setup/expense-categories;
    add_header X-Erp-Route web always;
    default_type application/json;
    include snippets/refuse-legacy-write.conf;
  }

  # 3. The list redirect. absolute_redirect off, as in every redirect above (a relative Location keeps
  #    :8088). A GET or HEAD redirects whatever its query string; the query is dropped, never reflected
  #    (T-4.1-09). Any other method reaches Perfex: its own DataTable POSTs to this path to read its rows.
  #    `~`, not `~*`, like the W1-06 lists: it refuses nothing, so a case variant reaching Perfex is a read.
  #    No `(?:index/?)?`: Perfex's list method is `categories`, not `index`.
  location ~ "^/admin/expenses/categories/?$" {
    absolute_redirect off;
    add_header X-Erp-Route $erp_setup_list_route always;
    if ($erp_setup_list_redirect) { return 302 /setup/expense-categories; }
    proxy_pass http://legacy;
    include snippets/proxy-common.conf;
  }

  # 4. The Node screens (IN-03): the list, /new and /<id>. erp-web's proxy.ts sends an anonymous visitor to
  #    /login?next=... before the page renders.
  location = /setup/expense-categories {
