# The one refusal used by every closed Perfex identity-write path (W1-06, plan 03.1-09).
#
# ADR-0034 decision 1 makes erp-api/src/v1/identity the only writer of tblstaff, tblstaff_permissions
# and tblroles; decision 2 makes granting admin-only; decision 3 writes one tblidentity_audit row in the
# same transaction as the change. A Perfex screen that writes those tables does none of that AND leaves
# Node's auth:perm:{staffId} snapshot stale, so the member keeps the old access until the next refresh.
#
# The refusal is a `return`, never a proxy_pass and never a redirect, and that is deliberate:
#   - proxying a form POST to node_web answers with Next's 404 page, which reads as "the page moved",
#     not as "your change was refused";
#   - redirecting a form POST makes the browser re-issue it as a GET, so the write silently does not
#     happen and the screen looks like it succeeded.
# 403 with a machine-readable code is unambiguous, cannot be mistaken for a 200, and the AJAX callers
# (the seven modules' permission modals, Perfex's status toggle) can tell a refusal from a page.
#
# The caller's location sets `add_header X-Erp-Route web always;` (the path belongs to the Node side now)
# and `default_type application/json;`. Both must live at location level: `default_type` is not allowed
# inside an `if`, and `add_header` inside an `if` would not inherit the enclosing block's headers.
return 403 '{"code":"ERP-LEGACY-0403","title":"This Perfex write path is closed: staff, roles and permissions are managed at /setup/staff and /setup/roles (ADR-0034)","detail":"Node is the only writer of tblstaff, tblstaff_permissions and tblroles. Granting requires the administrator flag and every change is audited."}';
