# The one refusal every Wave 2a Setup list uses (plan 04.1-07; the Expense Categories pilot, W2A-01).
#
# Once a Setup list's table is Node's in the ownership register, Perfex's own write paths for it are
# closed here, so the list has one writer. Each caller names where the list is managed now, so the one
# snippet serves every list; refuse-identity-write.conf stays the identity refusal (W1-06).
#
# The refusal is a `return`, never a proxy_pass and never a redirect, and that is deliberate:
#   - proxying a form POST to node_web answers with Next's 404 page, which reads as "the page moved",
#     not as "your change was refused";
#   - redirecting a form POST makes the browser re-issue it as a GET, so the write silently does not
#     happen and the screen looks like it succeeded.
# 403 with a machine-readable code is unambiguous, cannot be mistaken for a 200, and an AJAX caller
# (Perfex's delete link is one) can tell a refusal from a page.
#
# The caller's location has three duties, all at location level:
#   1. `set $erp_managed_at /setup/<list>;` BEFORE this include: `set` and `return` run in the order
#      they appear (both are rewrite-phase directives), so the body names the Node path of the list;
#   2. `add_header X-Erp-Route web always;` (the path belongs to the Node side now);
#   3. `default_type application/json;`.
# `default_type` is not allowed inside an `if`, and `add_header` inside an `if` would not inherit the
# enclosing block's headers, so neither goes in one.
#
# The title is plain words for a Perfex user (04.1-UI-SPEC "Perfex-side consequences"): no table, rule
# or ADR in it. managedAt is the public Node path where the list lives now, and nothing else.
return 403 '{"code":"ERP-LEGACY-0403","title":"This list is now managed in the new application.","managedAt":"$erp_managed_at"}';
